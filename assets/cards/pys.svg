  <text x="26" y="106" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8B949E">Projects, staff, documents and petitions for a municipal</text>
  <text x="26" y="126" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8B949E">software unit — JWT, SignalR chat, MinIO, PostgreSQL.</text>

  <g><rect x="26" y="152" width="108" height="26" rx="13" fill="#60A5FA" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.45"/><text x="80.0" y="169" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#60A5FA">ASP.NET Core</text></g>
  <g><rect x="144" y="152" width="72" height="26" rx="13" fill="#60A5FA" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.45"/><text x="180.0" y="169" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#60A5FA">EF Core</text></g>
