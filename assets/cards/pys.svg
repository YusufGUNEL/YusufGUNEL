  <g><circle cx="355" cy="40" r="4" fill="#60A5FA"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle><circle cx="400" cy="55" r="4" fill="#60A5FA"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="-0.7s" repeatCount="indefinite"/></circle><circle cx="365" cy="78" r="4" fill="#60A5FA"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="-1.4s" repeatCount="indefinite"/></circle><line x1="355" y1="40" x2="400" y2="55" stroke="#60A5FA" stroke-opacity="0.4"/><line x1="400" y1="55" x2="365" y2="78" stroke="#60A5FA" stroke-opacity="0.4"/><line x1="355" y1="40" x2="365" y2="78" stroke="#60A5FA" stroke-opacity="0.4"/></g>
