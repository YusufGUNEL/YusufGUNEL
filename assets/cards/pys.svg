  <rect x="1" y="1" width="438" height="198" rx="14" stroke="url(#bd)" stroke-width="1.6"/>

  <rect x="26" y="30" width="4" height="18" rx="2" fill="#60A5FA"/>
  <text x="40" y="45" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#E6EDF3">PYS Project Management</text>
  <text x="26" y="68" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#60A5FA" letter-spacing="1">FULL-STACK · .NET 10 WEB API</text>
  <rect x="26" y="78" width="52" height="2.5" rx="1.25" fill="#60A5FA">
