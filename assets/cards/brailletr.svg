  <text x="26" y="106" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8B949E">Reads embossed Turkish Braille from a phone photo and speaks it;</text>
  <text x="26" y="126" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8B949E">new dot-detection engine with no trained model, license-clean.</text>

  <g><rect x="26" y="152" width="65" height="26" rx="13" fill="#F97316" fill-opacity="0.10" stroke="#F97316" stroke-opacity="0.45"/><text x="58.5" y="169" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#F97316">OpenCV</text></g>
  <g><rect x="101" y="152" width="72" height="26" rx="13" fill="#F97316" fill-opacity="0.10" stroke="#F97316" stroke-opacity="0.45"/><text x="137.0" y="169" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#F97316">FastAPI</text></g>
  <g><rect x="183" y="152" width="43" height="26" rx="13" fill="#F97316" fill-opacity="0.10" stroke="#F97316" stroke-opacity="0.45"/><text x="204.5" y="169" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#F97316">PWA</text></g>
